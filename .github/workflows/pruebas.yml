# Pruebas automáticas: GitHub las corre solo cada vez que subes cambios.
# Si alguna falla, la insignia del README se pone roja y GitHub te avisa.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas del servidor de avisos y copias
        run: node servidor/pruebas.mjs

      - name: Instalar un navegador sin ventana (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Pruebas de la app (en el navegador)
        run: |
          python3 -m http.server 8000 &
          sleep 1
          node pruebas/ejecutar.mjs
